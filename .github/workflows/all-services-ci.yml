name: All Services CI/CD

on:
  push:
    branches: 
      - main
      - develop
      - 'ci/**'        # Allow CI testing on ci/* branches
      - 'feat/**'      # Allow CI testing on feat/* branches
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Test all Go services
  test-go-services:
    name: Test Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # service: [submission-judge, problem, gateway, contest]
        service: [gateway]
        # go-version: ['1.21', '1.22']
        go-version: ['1.22']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      
      - name: Install dependencies
        working-directory: src/Services/${{ matrix.service }}
        run: go mod download
      
      - name: Run tests
        working-directory: src/Services/${{ matrix.service }}
        run: |
          go test -v -race -coverprofile=coverage.out ./...
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./src/Services/${{ matrix.service }}/coverage.out
          flags: ${{ matrix.service }}

  # Test Auth service (Node.js)
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/Services/auth-v2/package-lock.json
      
      - name: Install dependencies
        working-directory: src/Services/auth-v2
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: src/Services/auth-v2
        run: npx prisma generate
        env:
          AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_test
      
      - name: Run Prisma migrations
        working-directory: src/Services/auth-v2
        run: npx prisma migrate deploy
        env:
          AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_test
      
      - name: Run unit tests
        working-directory: src/Services/auth-v2
        run: npm run test
        env:
          AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_test
      
      - name: Run E2E tests
        working-directory: src/Services/auth-v2
        run: npm run test:e2e
        env:
          AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./src/Services/auth-v2/coverage/lcov.info
          flags: auth-v2

  # Integration test - All services end-to-end
  integration-test:
    name: Integration Test - All Services
    runs-on: ubuntu-latest
    needs: [test-go-services, test-auth-service]
    
    # Use GitHub Actions services for databases (faster and more reliable)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      problem-mongodb:
        image: mongo:latest
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
      
      submission-mongodb:
        image: mongo:latest
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27018:27017
      
      redis:
        image: redis:latest
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Cache Docker Images
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-save
          key: ${{ runner.os }}-docker-${{ hashFiles('src/Services/**/Dockerfile', 'src/Services/**/go.mod', 'src/Services/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-docker-
      
      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          echo "✓ Cache hit! Loading Docker images..."
          if [ -d /tmp/docker-save ] && [ "$(ls -A /tmp/docker-save)" ]; then
            for img in /tmp/docker-save/*.tar; do
              if [ -f "$img" ]; then
                echo "Loading $img..."
                docker load -i "$img"
              fi
            done
            echo "✓ Docker images loaded from cache"
            docker images
          else
            echo "Cache directory empty"
          fi
      
      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          SUBMISSION_ENV=development
          SUBMISSION_MONGODB_URI=mongodb://localhost:27018/submissionjudgedb
          SUBMISSION_HOST=0.0.0.0
          SUBMISSION_LOG_LEVEL=debug
          SUBMISSION_MONGODB_DATABASE_NAME=submissionjudgedb
          SUBMISSION_JUDGE_PROBLEM_DIR=/problems_dir
          SUBMISSION_REDIS_URI=localhost:6379
          SUBMISSION_REDIS_PASSWORD=
          SUBMISSION_NUMBER_OF_JUDGE=5
          SUBMISSION_JUDGE_ID_OFFSET=0
          SUBMISSION_IS_MAIN_JUDGE=true
          SUBMISSION_PORT=8000
          SUBMISSION_ENDPOINT=http://submission-judge:8000
          
          GATEWAY_PORT=81
          GATEWAY_HOST=0.0.0.0
          GATEWAY_LOG_LEVEL=debug
          GATEWAY_ENVIRONMENT=Development
          
          PROBLEM_MONGO_URI=mongodb://localhost:27017/problem-db
          POLYGON_API_KEY=${{ secrets.POLYGON_API_KEY }}
          POLYGON_API_SECRET=${{ secrets.POLYGON_API_SECRET }}
          PROBLEM_STORAGE_DIR=/storage
          PROBLEM_HOST=0.0.0.0
          PROBLEM_PORT=3000
          PROBLEM_ENDPOINT=http://problem:3000
          PROBLEM_DATABASE_NAME=problem-db
          
          AUTH_PORT=50051
          AUTH_ENDPOINT=http://auth:50051
          AUTH_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/auth_db?schema=public
          NODE_ENV=development
          AUTH_JWT_SECRET=your-secret-key-here
          
          CONTEST_MONGO_URI=mongodb://localhost:27017/contestdb
          CONTEST_MONGO_DATABASE_NAME=contestdb
          CONTEST_REDIS_HOST=localhost
          CONTEST_REDIS_PORT=6379
          CONTEST_ENV=Development
          CONETST_LOG_LEVEL=debug
          CONTEST_PORT=8001
          CONTEST_HOST=0.0.0.0
          EOF
      
      - name: Create storage directories
        run: |
          mkdir -p storage/445985
          mkdir -p storage/440176
      
      - name: Build Docker images (if not cached)
        run: |
          echo "Building Docker images..."
          # Build only the application services, not databases
          docker compose build auth gateway problem submission-judge
          docker images
      
      - name: Start application services
        run: |
          echo "Starting application services (databases already running via GitHub Actions services)..."
          # Use --no-deps to prevent Docker Compose from starting database dependencies
          # This is needed because services have depends_on clauses pointing to databases
          docker compose up -d --no-deps auth gateway problem submission-judge
          echo "Services starting, initial wait..."
          sleep 15
      
      - name: Check running containers
        run: |
          echo "=== Container Status ==="
          docker compose ps
          echo ""
          echo "=== All Docker Containers ==="
          docker ps -a
          echo ""
          echo "=== Verify databases are accessible from host ==="
          echo "Postgres:"
          pg_isready -h localhost -p 5432 -U postgres || echo "Postgres not ready"
          echo "MongoDB (Problem):"
          mongosh --host localhost --port 27017 --eval "db.adminCommand('ping')" || echo "Problem MongoDB not ready"
          echo "MongoDB (Submission):"
          mongosh --host localhost --port 27018 --eval "db.adminCommand('ping')" || echo "Submission MongoDB not ready"
          echo "Redis:"
          redis-cli -h localhost -p 6379 ping || echo "Redis not ready"
      
      - name: Wait for auth service to be ready
        run: |
          echo "Waiting for auth service to be ready..."
          for i in {1..60}; do
            if curl -f http://localhost:50051/auth/health 2>/dev/null | grep -q "ok"; then
              echo "✓ Auth service is ready"
              break
            fi
            CONTAINER_INFO=$(docker ps --filter "name=auth" --format "{{.Status}}" 2>/dev/null || echo "not found")
            echo "Waiting for auth service... ($i/60) [Status: $CONTAINER_INFO]"
            sleep 2
          done
          docker compose logs --tail=30 auth
      
      - name: Initialize auth service database
        run: |
          echo "Running Prisma migrations..."
          docker compose exec -T auth npx prisma migrate deploy
          echo "Seeding database with admin user..."
          docker compose exec -T auth npx prisma db seed || echo "Seed may already exist"
          sleep 3
      
      - name: Wait for problem service to be ready
        run: |
          echo "Waiting for problem service..."
          for i in {1..60}; do
            if curl -f http://localhost:3000/ 2>/dev/null | grep -q "GET request"; then
              echo "✓ Problem service is ready"
              break
            fi
            echo "Waiting for problem service... ($i/60)"
            sleep 2
          done
          docker compose logs --tail=20 problem
      
      - name: Initialize test problems
        run: |
          echo "Initializing problem 445985..."
          curl -X POST "http://localhost:3000/problem/add?problemId=445985" -v || echo "Problem may already exist"
          sleep 5
          echo "Initializing problem 440176..."
          curl -X POST "http://localhost:3000/problem/add?problemId=440176" -v || echo "Problem may already exist"
          sleep 5
      
      - name: Wait for gateway service to be ready
        run: |
          echo "Waiting for gateway service..."
          for i in {1..60}; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:81/auth/login 2>/dev/null || echo "000")
            if [ "$STATUS_CODE" != "000" ] && [ "$STATUS_CODE" != "502" ] && [ "$STATUS_CODE" != "503" ]; then
              echo "✓ Gateway service is ready (HTTP $STATUS_CODE)"
              break
            fi
            echo "Waiting for gateway... ($i/60) [HTTP $STATUS_CODE]"
            sleep 2
          done
          docker compose logs --tail=20 gateway
      
      - name: Wait for submission-judge service to be ready
        run: |
          echo "Waiting for submission-judge service..."
          for i in {1..60}; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/v1/submission/view/test 2>/dev/null || echo "000")
            if [ "$STATUS_CODE" != "000" ] && [ "$STATUS_CODE" != "502" ] && [ "$STATUS_CODE" != "503" ]; then
              echo "✓ Submission-judge service is ready (HTTP $STATUS_CODE)"
              break
            fi
            echo "Waiting for submission-judge... ($i/60) [HTTP $STATUS_CODE]"
            sleep 2
          done
          docker compose logs --tail=30 submission-judge
          echo "Verifying isolate..."
          docker compose exec -T submission-judge isolate --version || echo "Warning: isolate check failed"
      
      - name: Run integration tests
        working-directory: src/Services/submission-judge
        run: |
          go test -v -timeout 10m ./src/tests -run TestEndToEndJudgingFlow
      
      - name: Save Docker images to cache
        if: always()
        run: |
          echo "Saving Docker images for caching..."
          mkdir -p /tmp/docker-save
          
          # Only cache the images we actually built (not base images)
          # Get unique list of built images
          BUILT_IMAGES=$(docker compose config --services | while read service; do
            # Get the image name for each service
            IMAGE=$(docker compose config | grep -A5 "^  $service:" | grep "image:" | head -1 | awk '{print $2}' || echo "")
            
            # If no image specified, it's built by docker compose
            if [ -z "$IMAGE" ]; then
              # Constructed image name pattern: projectname-servicename
              echo "online-judge-$service"
            fi
          done | sort -u)
          
          echo "Images to cache:"
          echo "$BUILT_IMAGES"
          
          # Save each built image
          for img in $BUILT_IMAGES; do
            # Check if image actually exists
            if docker image inspect "$img" >/dev/null 2>&1; then
              echo "Saving image: $img"
              SAFE_NAME=$(echo "$img" | sed 's/:/-/g' | sed 's/\//-/g')
              
              # Check available disk space before saving
              AVAILABLE=$(df /tmp | tail -1 | awk '{print $4}')
              IMAGE_SIZE=$(docker image inspect "$img" --format='{{.Size}}' | awk '{print int($1/1024)}')
              
              if [ "$AVAILABLE" -gt "$((IMAGE_SIZE + 1048576))" ]; then
                docker save "$img" -o "/tmp/docker-save/${SAFE_NAME}.tar" && \
                  echo "✓ Saved $img ($(ls -lh /tmp/docker-save/${SAFE_NAME}.tar | awk '{print $5}'))" || \
                  echo "✗ Failed to save $img"
              else
                echo "⚠ Skipping $img - insufficient disk space (need ${IMAGE_SIZE}KB, have ${AVAILABLE}KB)"
              fi
            else
              echo "⚠ Image $img does not exist, skipping"
            fi
          done
          
          # List what we saved
          if [ -d /tmp/docker-save ] && [ "$(ls -A /tmp/docker-save)" ]; then
            echo ""
            echo "✓ Cached images summary:"
            ls -lh /tmp/docker-save/
            echo "Total size: $(du -sh /tmp/docker-save | awk '{print $1}')"
          else
            echo "⚠ No images saved to cache"
          fi
      
      - name: Show service logs on failure
        if: failure()
        run: |
          echo "=== Problem Service Logs ==="
          docker compose logs problem
          echo "=== Auth Service Logs ==="
          docker compose logs auth
          echo "=== Gateway Service Logs ==="
          docker compose logs gateway
          echo "=== Submission Judge Logs ==="
          docker compose logs submission-judge
      
      - name: Stop services
        if: always()
        run: docker compose down

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

