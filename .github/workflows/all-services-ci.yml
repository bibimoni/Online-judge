  # Test Auth service (Node.js)
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/Services/auth-v2/package-lock.json
      
      - name: Install dependencies
        working-directory: src/Services/auth-v2
        run: npm ci
      
      - name: Run Prisma migrations
        working-directory: src/Services/auth-v2
        run: npx prisma migrate deploy
        env:
          AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_test
      
      - name: Run unit tests
        working-directory: src/Services/auth-v2
        run: npm run test
        env:
          AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_test
      
      - name: Run E2E tests
        working-directory: src/Services/auth-v2
        run: npm run test:e2e
        env:
          AUTH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/auth_test
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./src/Services/auth-v2/coverage/lcov.info
          flags: auth-v2

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Build Docker images
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    # needs: [test-go-services, test-auth-service]
    needs: [test-auth-service]
    if: github.event_name == 'push'
    strategy:
      matrix:
        # service: [submission-judge, problem, gateway, contest, auth-v2]
        service: [auth-v2]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./src/Services/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/online-judge-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/online-judge-${{ matrix.service }}:${{ github.sha }}
